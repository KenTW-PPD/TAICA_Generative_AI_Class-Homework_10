                    現有系統專注於情節與語意記憶；如何將代理人成功的工具調用序列與工作流反思抽象為可重用的動作模式？
                  </p>
                </div>
                <div class="p-3.5 rounded-xl bg-slate-950 border border-slate-800 space-y-1.5">
                  <span class="font-mono text-cyan-400 font-bold">2. 自適應檢索深度 (Adaptive k)</span>
                  <p class="text-xs md:text-sm text-slate-400 leading-relaxed">
                    實證顯示最優檢索深度 $k$ 強烈依賴模型與題型。如何依據問題複雜度與信心動態調整 $k$ 以避免噪音干擾？
                  </p>
                </div>
                <div class="p-3.5 rounded-xl bg-slate-950 border border-slate-800 space-y-1.5">
                  <span class="font-mono text-cyan-400 font-bold">3. 多模態記憶與生命週期治理</span>
                  <p class="text-xs md:text-sm text-slate-400 leading-relaxed">
                    超越純文本對話，跨越影像、音訊與 UI 操作狀態的統一記憶索引，以及模擬人類艾賓浩斯機制的自適應遺忘。
                  </p>
                </div>
              </div>
            </div>

            <!-- Concluding Banner -->
            <div class="p-4 rounded-xl bg-gradient-to-r from-cyan-950/70 via-slate-900 to-emerald-950/70 border border-slate-800 flex items-center justify-between text-xs md:text-sm">
              <span class="text-slate-100 font-medium">🎯 總結：記憶系統是生產級 AI 代理人的第一基石。掌握 Working Memory 與 Long-Term Memory 的分工，方能跨越上下文視窗的物理桎梏。</span>
              <button onclick="goToSlide(0)" class="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 font-mono text-xs md:text-sm transition cursor-pointer font-bold shrink-0 ml-4">
                回到首頁 &uarr;
              </button>
            </div>
          </div>
        `
      }
    ];

    let currentSlide = 0;
    const totalSlides = slidesData.length;

    function renderMath() {
      if (typeof renderMathInElement === 'function') {
        const container = document.getElementById('slideContent');
        if (container) {
          try {
            renderMathInElement(container, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$', right: '$', display: false },
                { left: '\\[', right: '\\]', display: true },
                { left: '\\(', right: '\\)', display: false }
              ],
              throwOnError: false,
              errorColor: '#f43f5e'
            });
          } catch (e) {
            console.warn('KaTeX render warning:', e);
          }
        }
      }
    }

    function renderSlide() {
      const slide = slidesData[currentSlide];
      const container = document.getElementById('slideContent');
      
      // Update top header and indicators
      document.getElementById('slideIndicator').textContent = `${String(currentSlide + 1).padStart(2, '0')} / ${String(totalSlides).padStart(2, '0')}`;
      document.getElementById('slideHeaderTopic').textContent = `${slide.category} · ${slide.title}`;
      document.getElementById('progressBar').style.width = `${((currentSlide + 1) / totalSlides) * 100}%`;
      document.getElementById('wikiSourceBadge').textContent = `來源: ${slide.wikiSource}`;
      
      // Button states
      document.getElementById('prevBtn').disabled = currentSlide === 0;
      document.getElementById('nextBtn').disabled = currentSlide === totalSlides - 1;

      // Render content with fixed min-height header to guarantee 100% unified title height across all slides
      container.innerHTML = `
        <div class="w-full flex items-start justify-between border-b border-slate-800 pb-3 mb-4 min-h-[82px] md:min-h-[88px] shrink-0">
          <div class="space-y-0.5">
            <div class="text-xs md:text-sm font-mono text-cyan-400 uppercase tracking-wider font-bold leading-none mb-1">${slide.category}</div>
            <h2 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight leading-tight">${slide.title}</h2>
            <p class="text-xs md:text-sm text-slate-300 mt-1">${slide.subtitle}</p>
          </div>
          <span class="hidden sm:inline-flex items-center font-mono text-xs md:text-sm text-cyan-400 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800 font-bold shrink-0 ml-4">
            Slide ${currentSlide + 1}
          </span>
        </div>
        <div class="flex-1 overflow-y-auto pr-1">
          ${slide.render()}
        </div>
      `;

      // Update outline drawer active state
      updateOutlineActive();

      // Render math equations
      renderMath();
      setTimeout(renderMath, 60);
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function goToSlide(index) {
      if (index >= 0 && index < totalSlides) {
        currentSlide = index;
        renderSlide();
        closeOutline();
      }
    }

    function toggleOutline() {
      const drawer = document.getElementById('outlineDrawer');
      drawer.classList.toggle('hidden');
    }

    function closeOutline() {
      document.getElementById('outlineDrawer').classList.add('hidden');
    }

    function initOutline() {
      const list = document.getElementById('outlineList');
      list.innerHTML = slidesData.map((s, idx) => `
        <button onclick="goToSlide(${idx})" id="outline-item-${idx}" class="w-full text-left p-3 rounded-xl hover:bg-slate-800 transition flex items-center justify-between text-slate-300 hover:text-white border border-transparent hover:border-slate-700 cursor-pointer">
          <div class="flex items-center gap-2.5 truncate">
            <span class="font-mono text-xs text-cyan-400 font-bold w-6">${String(idx + 1).padStart(2, '0')}</span>
            <span class="truncate font-medium text-xs md:text-sm">${s.title}</span>
          </div>
          <span class="text-xs font-mono text-slate-500 shrink-0 ml-2">${s.wikiSource.replace('wiki/', '')}</span>
        </button>
      `).join('');
    }

    function updateOutlineActive() {
      slidesData.forEach((_, idx) => {
        const item = document.getElementById(`outline-item-${idx}`);
        if (item) {
          if (idx === currentSlide) {
            item.classList.add('bg-cyan-950/70', 'border-cyan-800/60', 'text-cyan-200');
            item.classList.remove('text-slate-300');
          } else {
            item.classList.remove('bg-cyan-950/70', 'border-cyan-800/60', 'text-cyan-200');
            item.classList.add('text-slate-300');
          }
        }
      });
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'o' || e.key === 'O') {
        toggleOutline();
      } else if (e.key === 'Escape') {
        closeOutline();
      }
    });

    // Initialize
    initOutline();
    renderSlide();
    window.addEventListener('load', renderMath);
    document.addEventListener('DOMContentLoaded', renderMath);
  </script>
</body>
</html>
